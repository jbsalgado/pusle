name: pulse_app
description: "Pulse – App de vendas nativo Android/iOS com suporte offline."
publish_to: "none"

version: 2.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ─── Banco de dados local (SQLite via drift) ─────────────────────
  drift: ^2.23.1
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27

  # ─── Rede e conectividade ─────────────────────────────────────────
  http: ^1.2.0
  connectivity_plus: ^6.1.4

  # ─── Auth / Segurança ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4

  # ─── UUID gerado no cliente ───────────────────────────────────────
  uuid: ^4.5.1

  # ─── Formatação de datas ──────────────────────────────────────────
  intl: ^0.19.0

  # ─── State management ─────────────────────────────────────────────
  provider: ^6.1.2

  # ─── Persistência simples (flags de UI, última sync) ──────────────
  shared_preferences: ^2.2.2

  # ─── Impressão / Scanner / Bluetooth ──────────────────────────────
  flutter_bluetooth_serial: ^0.4.0
  permission_handler: ^11.3.1
  mobile_scanner: ^5.1.0
  printing: ^5.12.0
  image: ^4.2.0

  # ─── Compartilhamento nativo ──────────────────────────────────────
  share_plus: ^10.1.0
  path_provider: ^2.1.3

  # ─── WebView (shell legado — mantido) ─────────────────────────────
  flutter_inappwebview: ^6.1.5
  flutter_foreground_task: ^6.4.0
  app_links: ^6.3.2
  receive_sharing_intent: ^1.8.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ─── drift code generation ────────────────────────────────────────
  drift_dev: ^2.23.1
  build_runner: ^2.4.15

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
